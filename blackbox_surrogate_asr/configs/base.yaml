seed: 13

models:
  target: facebook/hubert-large-ls960-ft
  surrogate: facebook/wav2vec2-base-100h

paths:
  checkpoints: checkpoints
  best_model: checkpoints/best_model
  logs: logs/tensorboard
  pseudo_labels: artifacts/pseudo_labels.json
  attack_audio: artifacts/adv.wav
  results_dir: results

data:
  dataset_name: librispeech
  query_dataset_root: ../LibriSpeech/train-clean-100
  supported_query_budgets: [100, 500, 1000, 2000, 5000]

training:
  validation_ratio: 0.1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.00003
  num_train_epochs: 50
  bf16: true
  fp16: false
  logging_steps: 25
  save_total_limit: 2

attack:
  target_phrase: OPEN THE DOOR
  epsilon: 0.002
  alpha: 0.0002
  iterations: 40
  cer_threshold: 0.5
  wer_threshold: 0.5
